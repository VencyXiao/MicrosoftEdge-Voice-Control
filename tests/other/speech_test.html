<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Web Speech API 识别测试</title>
<style>
  body { font: 14px/1.6 "Microsoft YaHei", sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  #state { padding: 12px; border-radius: 8px; background: #f2f4f8; margin: 16px 0; }
  button { padding: 10px 28px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; }
  #start { background: #1a73e8; color: #fff; }
  #start:disabled { background: #aaa; }
  #result { min-height: 60px; padding: 12px; border: 1px dashed #bbb; border-radius: 8px; margin-top: 12px; font-size: 16px; }
  .ok { background: #e6f7e9; } .bad { background: #fdecec; }
  code { background: #eef; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Web Speech API 语音识别测试</h1>
  <div id="state">检测中…</div>
  <button id="start">🎤 开始识别</button>
  <div id="result">识别结果将显示在这里</div>
  <p>请对麦克风说普通话，如"打开百度"。连续说话数秒后停止，观察是否出现识别文字。</p>

<script>
  const stateEl = document.getElementById('state');
  const resultEl = document.getElementById('result');
  const startBtn = document.getElementById('start');

  // 环境检测：浏览器是否提供 SpeechRecognition 接口
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    stateEl.className = 'bad';
    stateEl.textContent = '❌ 此浏览器不支持 SpeechRecognition（该 API 不可用），Web Speech 方案在当前浏览器走不通';
    startBtn.disabled = true;
  } else {
    stateEl.className = 'ok';
    stateEl.textContent = '✅ 支持 SpeechRecognition，可以开始测试（首次会请求麦克风权限）';
  }

  let rec = null;
  startBtn.addEventListener('click', () => {
    if (rec) { rec.stop(); return; } // 再次点击 = 停止
    rec = new SR();
    rec.lang = 'zh-CN';            // 中文识别
    rec.continuous = true;         // 连续识别
    rec.interimResults = true;     // 返回中间结果

    rec.onstart = () => { startBtn.textContent = '⏹ 停止识别'; stateEl.textContent = '正在聆听…请说话'; };
    rec.onresult = (e) => {
      // 拼接全部结果：final 为最终文本，interim 为中间文本
      let text = '';
      for (const r of e.results) text += r[0].transcript;
      resultEl.textContent = text;
    };
    rec.onerror = (e) => {
      stateEl.className = 'bad';
      // network 错误 = 底层服务连不上（国内走 Google/Azure 的判断依据）
      stateEl.textContent = '❌ 错误: ' + e.error + (e.error === 'network' ? '（网络不通，识别服务不可达）' : '');
      startBtn.textContent = '🎤 开始识别';
    };
    rec.onend = () => { startBtn.textContent = '🎤 开始识别'; stateEl.textContent = '识别已结束（continuous 模式下自动重启可继续）'; };

    rec.start();
  });
</script>
</body>
</html>
